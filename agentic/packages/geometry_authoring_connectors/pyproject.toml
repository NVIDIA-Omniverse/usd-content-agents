[project]
name = "geometry-authoring-connectors"
dynamic = ["version"]
description = "Fail-closed reference connectors for external geometry authoring providers"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [
    {name = "Omniverse GenAI Team"},
]
dependencies = [
    "geometry-authoring-contracts",
    "pydantic>=2.11,<3.0.0",
    "requests>=2.32,<3",
]

[tool.uv.sources]
geometry-authoring-contracts = { path = "../geometry_authoring_contracts", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["geometry_authoring_connectors"]
ignore-vcs = true

[tool.hatch.build.targets.wheel.force-include]
"LICENSE" = "geometry_authoring_connectors/LICENSE"

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/geometry_authoring_connectors",
    "/tests",
]
ignore-vcs = true

[build-system]
requires = ["hatchling<1.32.0", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.uv-dynamic-versioning]
enable = true
vcs = "git"
pattern = "default-unprefixed"
fallback-version = "0.6.0"
from-file = { source = "../../../VERSION.md" }

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
