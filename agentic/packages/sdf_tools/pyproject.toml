[project]
name = "sdf-tools"
dynamic = ["version"]
description = "Backend-neutral signed-distance-field tools for content-agent geometry workflows"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [
    {name = "Omniverse GenAI Team"},
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["sdf_tools"]
ignore-vcs = true

[tool.hatch.build.targets.wheel.force-include]
"LICENSE" = "sdf_tools/LICENSE"

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/sdf_tools",
    "/tests",
    "/uv.lock",
]
ignore-vcs = true

[build-system]
requires = ["hatchling<1.32.0", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.uv-dynamic-versioning]
enable = true
vcs = "git"
pattern = "default-unprefixed"
fallback-version = "0.6.0"
from-file = { source = "../../../VERSION.md" }

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
