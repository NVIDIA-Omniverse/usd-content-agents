[project]
name = "geometry-agent-service"
dynamic = ["version"]
description = "Authenticated public service for geometry authoring handoff, repair, validation, and evidence"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [
    {name = "Omniverse GenAI Team"},
]
dependencies = [
    "content-agent-workflows",
    "geometry-authoring-contracts",
    "geometry-authoring-connectors",
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.9",
    "requests>=2.33.0,<3",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=9.0.3,<10",
    "pyyaml>=6.0",
    "ruff>=0.6.0",
]

[project.scripts]
geometry-agent = "geometry_agent_client.cli:main"
geometry-agent-service = "geometry_agent_service.main:main"

[tool.uv.sources]
content-agent-workflows = { path = "../../agentic/packages/content_agent_workflows", editable = true }
geometry-authoring-contracts = { path = "../../agentic/packages/geometry_authoring_contracts", editable = true }
geometry-authoring-connectors = { path = "../../agentic/packages/geometry_authoring_connectors", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["geometry_agent_client", "geometry_agent_service"]
ignore-vcs = true

[tool.hatch.build.targets.sdist]
include = [
    "/Dockerfile",
    "/LICENSE",
    "/README.md",
    "/geometry_agent_client",
    "/openapi.yaml",
    "/pyproject.toml",
    "/geometry_agent_service",
    "/tests",
]
ignore-vcs = true

[build-system]
requires = ["hatchling<1.32.0", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.uv-dynamic-versioning]
enable = true
vcs = "git"
pattern = "default-unprefixed"
fallback-version = "0.6.0"
from-file = { source = "../../VERSION.md" }

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
