openapi: 3.1.0
info:
  title: Material Agent Service
  description: >-
    Fixed pipeline REST API for VLM-based material assignment to 3D USD
    objects. This v0.6 interface does not invoke the default agentic Content
    Workflow.
  version: "0.6.0"
servers:
  - url: http://localhost:8000
    description: Local development server

paths:
  /auth/session:
    post:
      summary: Exchange a service token for a browser session cookie
      description: >-
        Browser clients cannot attach an Authorization header to EventSource
        streams, image sources, or download navigations. This endpoint accepts
        the service token and sets a signed, expiring, HttpOnly,
        SameSite=Strict cookie that the guard accepts as an alternative
        credential. The cookie is derived from the token and does not contain
        it, so rotating MATERIAL_AGENT_TOKEN invalidates every issued session.
        Unauthenticated by design -- it is how a client obtains a credential --
        and it validates the supplied token itself.
      operationId: create_auth_session
      # Not gated by the shared route guard -- the handler validates the token
      # itself, so the generated schema carries no security requirement and
      # this must match it. The bearer token is still required; see the
      # description.
      security: []
      responses:
        '204':
          description: Session established; the cookie is set.
        '401':
          description: Missing or invalid service token.
        '409':
          description: >-
            The service has no token configured, so there is no session to
            establish.
    delete:
      summary: Clear the browser session cookie
      operationId: delete_auth_session
      security: []
      responses:
        '204':
          description: Cookie cleared.
  /health:
    get:
      summary: Health check
      operationId: health
      tags: [utility]
      responses:
        "200":
          description: Service health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: healthy }
                  service: { type: string }
                  version: { type: string }
                  api_keys_configured: { type: boolean }
                  auth_enforced:
                    type: boolean
                    description: Whether bearer-token enforcement is active on this server.
                  image_gen_configured: { type: boolean }
                  max_active_sessions: { type: integer }

  /config/vlm-models:
    get:
      summary: List available VLM models
      operationId: getVlmModels
      tags: [utility]
      responses:
        "200":
          description: Available VLM models
          content:
            application/json:
              schema:
                type: object
                properties:
                  models:
                    type: array
                    items:
                      type: object
                      properties:
                        value: { type: string }
                        label: { type: string }
                        is_default: { type: boolean }

  /pipeline/upload-usd:
    post:
      summary: Upload USD file and create a session
      operationId: uploadUsd
      tags: [pipeline]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [usd_file]
              properties:
                usd_file:
                  type: string
                  format: binary
                  description: USD file (.usd, .usda, .usdc, .usdz)
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCreated" }
        "400": { description: Invalid file type }
        "413": { description: File too large }

  /pipeline:
    post:
      summary: Start material assignment pipeline
      operationId: startPipeline
      tags: [pipeline]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              anyOf:
                - required: [session_id]
                - required: [s3_uri]
                - required: [usd_file]
              properties:
                usd_file:
                  type: string
                  format: binary
                  description: USD file used when neither session_id nor s3_uri is provided
                session_id:
                  type: string
                  description: Existing session ID from /upload-usd; takes priority over s3_uri and usd_file
                s3_uri:
                  type: string
                  description: S3 URI to a USD file. Its exact bucket must be listed in MA_S3_ALLOWED_BUCKETS; empty rejects all. Used when session_id is absent and takes priority over usd_file.
                user_email:
                  type: string
                  description: Optional user email for usage tracking. Omitted or blank values use MA_DEFAULT_USER_EMAIL, then anonymous@example.com when that fallback is blank.
                reference_images:
                  type: array
                  items: { type: string, format: binary }
                  description: Reference images for VLM context
                reference_pdfs:
                  type: array
                  items: { type: string, format: binary }
                  description: Reference PDFs retained as provenance outside visual-model inputs; this endpoint does not extract material claims from uploads
                reference_descriptions:
                  type: string
                  description: JSON array of image descriptions
                generated_reference_id:
                  type: string
                  description: Generated reference ID returned by generate-reference-image
                enable_material_generation:
                  type: string
                  default: "false"
                  description: Enable generated material-library mode for this pipeline. Requires at least one uploaded reference image or generated_reference_id and deployment image-generation configuration.
                material_generation_guidance:
                  type: string
                  description: Optional guidance for asset-specific material generation
                material_generation_texture_size:
                  type: integer
                  minimum: 64
                  maximum: 4096
                  default: 1024
                  description: Texture map size for generated materials
                pdf_descriptions:
                  type: string
                  description: JSON array of PDF descriptions
                materials_zip:
                  type: string
                  format: binary
                  description: ZIP with custom materials (materials.yaml + USD library)
                user_prompt:
                  type: string
                  description: Custom VLM prompt
                camera_views:
                  type: string
                  default: "+x+y+z,-x-y-z"
                  description: Comma-separated camera views
                coverage_policy:
                  type: string
                  enum: [strict, allow_partial]
                  default: allow_partial
                  description: strict fails closed before final success when prediction or binding coverage is incomplete; allow_partial preserves artifacts with explicit partial readiness. Large-scene mode currently requires allow_partial and reports not_evaluated.
                optimize_usd:
                  type: string
                  default: "true"
                  description: Enable USD optimization
                enable_deinstance:
                  type: string
                  default: "true"
                enable_split:
                  type: string
                  default: "true"
                enable_deduplicate:
                  type: string
                  default: "true"
                skip_instances:
                  type: string
                  default: "true"
                skip_prototypes:
                  type: string
                  default: "false"
                skip_existing_materials:
                  type: string
                  default: "false"
                pdf_first_page:
                  type: integer
                  description: First page to convert from PDFs (1-indexed)
                pdf_last_page:
                  type: integer
                  description: Last page to convert from PDFs (1-indexed)
                vlm_model:
                  type: string
                  description: VLM model override
                vlm_max_workers:
                  type: integer
                  description: Max parallel VLM workers (default 64)
                render_num_workers:
                  type: integer
                  minimum: 1
                  maximum: 32
                  description: Max parallel render workers for build_dataset_usd (capped by MA_MAX_RENDER_NUM_WORKERS)
                enable_prim_clustering:
                  type: string
                  default: "false"
                  description: Enable image-based clustering of visually similar prims before prediction
                cluster_min_prims:
                  type: integer
                  minimum: 1
                  description: Minimum prim count before prim clustering runs
                cluster_embedding_backend:
                  type: string
                  description: Embedding backend for prim clustering
                cluster_embedding_model:
                  type: string
                  description: Embedding model for prim clustering
                cluster_embedding_base_url:
                  type: string
                  description: Optional embedding API base URL for prim clustering. Request overrides are restricted to hosted NVIDIA URLs or the deployment-configured MA_CLUSTER_EMBEDDING_BASE_URL.
                cluster_embedding_max_workers:
                  type: integer
                  minimum: 1
                  description: Max parallel embedding workers for prim clustering
                cluster_embedding_batch_size:
                  type: integer
                  minimum: 1
                  description: Embedding batch size for prim clustering
                cluster_max_size:
                  type: integer
                  minimum: 1
                  description: Maximum prims that can share one representative prediction before a cluster is split
                cluster_similarity_threshold_low:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 1
                  description: Similarity threshold for low-complexity prim clusters
                cluster_similarity_threshold_medium:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 1
                  description: Similarity threshold for medium-complexity prim clusters
                cluster_similarity_threshold_high:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 1
                  description: Similarity threshold for high-complexity prim clusters
                cluster_report:
                  type: string
                  default: "true"
                  description: Generate the cluster HTML report when clustering runs
                layer_only:
                  type: string
                  default: "false"
                  description: Output only a material binding layer instead of a full USD (true/false, default false), preserving the original scene structure
      responses:
        "202":
          description: Pipeline started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCreated" }
        "400": { description: Invalid input }
        "403": { description: S3 bucket not allowlisted or S3 access denied }
        "404": { description: Client-supplied S3 object was not found }
        "413": { description: File too large }
        "502": { description: Failed to download the client-supplied S3 object }
        "503": { description: Image-generation configuration is required for generated material-library mode }

  /pipeline/{session_id}/status:
    get:
      summary: Get pipeline execution status
      operationId: getPipelineStatus
      tags: [pipeline]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Pipeline status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PipelineStatus" }
        "404": { description: Session not found }

  /pipeline/{session_id}/generate-reference-image:
    post:
      summary: Generate an AI reference image from the input preview
      operationId: generateReferenceImage
      tags: [pipeline]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt:
                  type: string
                  description: Text prompt describing the desired materials/look
      responses:
        "200":
          description: Reference image generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  reference_id: { type: string }
                  image_url:
                    type: string
                    example: /assets/session-id/generated-ref/reference-id
        "400": { description: Input preview missing or prompt empty }
        "404": { description: Session not found }
        "409": { description: Session already queued or running }
        "503": { description: Image generation backend not configured }

  /pipeline/{session_id}/generated-reference-image/{reference_id}:
    delete:
      summary: Delete a generated reference image
      operationId: deleteGeneratedReferenceImage
      tags: [pipeline]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
        - name: reference_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Generated reference deleted }
        "404": { description: Session or generated reference not found }
        "409": { description: Session already queued or running }

  /pipeline/{session_id}/results:
    get:
      summary: Get pipeline results (only when completed)
      operationId: getPipelineResults
      tags: [pipeline]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Pipeline results
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/PipelineResults" }
                  - { $ref: "#/components/schemas/PipelineError" }
        "202": { description: Still running }
        "404": { description: Session not found }

  /pipeline/{session_id}/cancel:
    post:
      summary: Cancel a running pipeline
      operationId: cancelPipeline
      tags: [pipeline]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cancellation acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: string }
                  status: { type: string, example: cancelling }
                  message: { type: string }
        "400": { description: Cannot cancel (not running) }
        "404": { description: Session not found }

  /pipeline/{session_id}/events:
    get:
      summary: Stream real-time progress events (SSE)
      operationId: streamEvents
      tags: [pipeline]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: object
                description: ProgressEvent JSON in SSE data field
                properties:
                  session_id: { type: string }
                  step: { type: string }
                  state: { type: string, enum: [running, completed, failed, cancelled] }
                  percent: { type: integer }
                  message: { type: string }
                  overall_percent: { type: integer }
                  extra: { type: object }
        "404": { description: Session not found }

  /pipeline/{session_id}/regenerate:
    post:
      summary: Regenerate material pipeline steps
      operationId: regeneratePipeline
      tags: [pipeline]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegenerateRequest" }
      responses:
        "202":
          description: Regeneration started
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCreated" }
        "400": { description: Session is running or lacks cached input }
        "404": { description: Session not found }
        "422": { description: Invalid request body }

  /pipeline/{session_id}/event-log:
    get:
      summary: Get persisted pipeline event history
      operationId: getEventLog
      tags: [pipeline]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Persisted progress events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
                    description: Number of events when an event log exists
        "404": { description: Session not found }
        "500": { description: Event log could not be read }

  /artifacts/{session_id}/output:
    get:
      summary: Download output USD with materials applied
      operationId: downloadOutput
      tags: [artifacts]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Flattened USD file
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { description: File not available }

  /artifacts/{session_id}/final-render:
    get:
      summary: Download final render image
      operationId: downloadFinalRender
      tags: [artifacts]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PNG render image
          content:
            image/png:
              schema: { type: string, format: binary }
        "404": { description: Render not available }

  /artifacts/{session_id}/predictions:
    get:
      summary: Download predictions JSONL
      operationId: downloadPredictions
      tags: [artifacts]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Predictions JSONL file
          content:
            application/x-ndjson:
              schema: { type: string }
        "404": { description: Predictions not available }

  /artifacts/{session_id}/cluster-map:
    get:
      summary: Download prim clustering map JSONL
      operationId: downloadClusterMap
      tags: [artifacts]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cluster map JSONL file
          content:
            application/x-ndjson:
              schema: { type: string }
        "404": { description: Cluster map not available }

  /artifacts/{session_id}/cluster-report:
    get:
      summary: View prim clustering HTML report
      operationId: viewClusterReport
      tags: [artifacts]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: HTML cluster report
          content:
            text/html:
              schema: { type: string }
        "404": { description: Cluster report not available }

  /artifacts/{session_id}/cluster-summary:
    get:
      summary: Download prim clustering summary JSON
      operationId: downloadClusterSummary
      tags: [artifacts]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Cluster summary JSON file
          content:
            application/json:
              schema: { type: object }
        "404": { description: Cluster summary not available }

  /artifacts/{session_id}/cluster-representatives:
    get:
      summary: Download representative-only clustering dataset JSONL
      operationId: downloadClusterRepresentatives
      tags: [artifacts]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Representative-only dataset JSONL file
          content:
            application/x-ndjson:
              schema: { type: string }
        "404": { description: Cluster representatives dataset not available }

  /artifacts/{session_id}/report:
    get:
      summary: View prediction HTML report
      operationId: viewReport
      tags: [artifacts]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: HTML prediction report
          content:
            text/html:
              schema: { type: string }
        "404": { description: Not available }

  /artifacts/{session_id}/optimization-report:
    get:
      summary: View optimization JSON report
      operationId: viewOptimizationReport
      tags: [artifacts]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Optimization report
          content:
            application/json:
              schema: { type: object }
        "404": { description: Not available }

  /assets/{session_id}/input-render:
    get:
      summary: Get input USD render (before material assignment)
      operationId: getInputRender
      tags: [assets]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PNG preview image
          content:
            image/png:
              schema: { type: string, format: binary }
        "404": { description: Not available }
        "424": { description: Render failed }
        "503": { description: Render still in progress }

  /assets/{session_id}/generated-ref:
    get:
      summary: Get generated reference image
      operationId: getGeneratedReferenceImage
      tags: [assets]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PNG generated reference image
          content:
            image/png:
              schema: { type: string, format: binary }
        "404": { description: Not available }

  /assets/{session_id}/generated-ref/{reference_id}:
    get:
      summary: Get generated reference image by ID
      operationId: getGeneratedReferenceImageById
      tags: [assets]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
        - name: reference_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PNG generated reference image
          content:
            image/png:
              schema: { type: string, format: binary }
        "404": { description: Not available }

  /assets/{session_id}/previews:
    get:
      summary: List all preview images
      operationId: listPreviews
      tags: [assets]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Preview image list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PreviewList" }
        "404": { description: Session not found }

  /assets/{session_id}/preview/{image_name}:
    get:
      summary: Get a specific preview image
      operationId: getPreview
      tags: [assets]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
        - name: image_name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PNG preview image
          content:
            image/png:
              schema: { type: string, format: binary }
        "404": { description: Not available }

  /assets/{session_id}/failure-evidence:
    get:
      summary: List bounded evidence retained for a failed pipeline
      operationId: listFailureEvidence
      tags: [assets]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Failure evidence listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FailureEvidence" }
        "404": { description: Session or failure evidence not found }

  /assets/{session_id}/failure-evidence/{file_name}:
    get:
      summary: Download an allowlisted failure report or render sample
      operationId: getFailureEvidenceFile
      tags: [assets]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
        - name: file_name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: JSON report or PNG failed-render sample
          content:
            application/json:
              schema: { type: object }
            image/png:
              schema: { type: string, format: binary }
        "404": { description: Failure evidence not available }

  /assets/{session_id}/references:
    get:
      summary: List reference images
      operationId: listReferences
      tags: [assets]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Reference image list
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: string }
                  references:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        url: { type: string }
                  total: { type: integer }
        "404": { description: Session not found }

  /assets/{session_id}/reference/{image_name}:
    get:
      summary: Get a reference image
      operationId: getReference
      tags: [assets]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
        - name: image_name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Reference image
          content:
            image/png:
              schema: { type: string, format: binary }
        "404": { description: Not available }

  /assets/{session_id}/reference-pdfs:
    get:
      summary: List reference PDFs
      operationId: listReferencePdfs
      tags: [assets]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Reference PDF list
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: string }
                  pdfs:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        url: { type: string }
                  total: { type: integer }
        "404": { description: Session not found }

  /assets/{session_id}/reference-pdf/{pdf_name}:
    get:
      summary: Get a reference PDF
      operationId: getReferencePdf
      tags: [assets]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
        - name: pdf_name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404": { description: Not available }

  /sessions:
    get:
      summary: List all sessions
      operationId: listSessions
      tags: [sessions]
      responses:
        "200":
          description: Session list
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items: { $ref: "#/components/schemas/SessionSummary" }
                  total: { type: integer }
                  active_count: { type: integer }
                  max_active_sessions: { type: integer }

  /sessions/usage:
    get:
      summary: Get aggregate usage statistics
      operationId: getUsage
      tags: [sessions]
      parameters:
        - name: from_date
          in: query
          schema: { type: string, format: date-time }
          description: ISO 8601 start date filter
        - name: to_date
          in: query
          schema: { type: string, format: date-time }
          description: ISO 8601 end date filter
        - name: user_email
          in: query
          schema: { type: string }
          description: Filter by user email
      responses:
        "200":
          description: Usage statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_sessions: { type: integer }
                  total_completed: { type: integer }
                  total_failed: { type: integer }
                  by_user: { type: object }
                  by_asset: { type: object }
        "400": { description: Invalid date format }

  /sessions/{session_id}:
    get:
      summary: Get session details
      operationId: getSession
      tags: [sessions]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Session metadata
          content:
            application/json:
              schema: { type: object }
        "404": { description: Session not found }
    delete:
      summary: Delete session and all artifacts
      operationId: deleteSession
      tags: [sessions]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Session deleted }
        "404": { description: Session not found }

  /sessions/admin/cleanup:
    post:
      summary: Trigger manual session cleanup
      operationId: adminCleanup
      tags: [sessions]
      parameters:
        - name: max_age_hours
          in: query
          schema: { type: number, default: 24.0 }
          description: Max age before local cache cleanup
      responses:
        "200":
          description: Cleanup results
          content:
            application/json:
              schema:
                type: object
                properties:
                  cleaned_local_cache: { type: integer }
                  expired_sessions_removed: { type: integer }
                  max_age_hours: { type: number }

  /materials:
    get:
      summary: List available materials
      operationId: listMaterials
      tags: [materials]
      responses:
        "200":
          description: Materials catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  materials:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        description: { type: string }
                        binding: { type: string }
                        icon_url: { type: string, nullable: true }
                        icon_path: { type: string, nullable: true }
                  total: { type: integer }

  /materials/icon/{material_name}:
    get:
      summary: Get material icon image
      operationId: getMaterialIcon
      tags: [materials]
      parameters:
        - name: material_name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: PNG icon image
          content:
            image/png:
              schema: { type: string, format: binary }
        "404": { description: Material not found }

  /materials/template:
    get:
      summary: Download default materials template ZIP
      operationId: downloadMaterialsTemplate
      tags: [materials]
      responses:
        "200":
          description: ZIP with materials.yaml + USD library; thumbnails optional
          content:
            application/zip:
              schema: { type: string, format: binary }
        "404": { description: Template not found }

components:
  schemas:
    PipelineStep:
      type: string
      enum:
        - build_dataset_prepare_dataset
        - build_dataset_usd
        - cluster_prims
        - expand_cluster_predictions
        - predict
        - apply
        - render

    RegenerateRequest:
      type: object
      required: [steps]
      properties:
        steps:
          type: array
          description: Pipeline steps to re-run from cache
          items: { $ref: "#/components/schemas/PipelineStep" }
        user_prompt:
          type: string
          nullable: true
          description: Override user prompt for regeneration
        layer_only:
          type: boolean
          default: false
          description: Output only a material binding layer when re-running apply
        coverage_policy:
          type: string
          enum: [strict, allow_partial]
          nullable: true
          description: Optional coverage policy override for this regeneration

    SessionCreated:
      type: object
      properties:
        session_id: { type: string }
        status: { type: string, example: ready }
        message: { type: string }
        estimated_duration_minutes: { type: integer, nullable: true }

    DiagnosticEvidenceNames:
      type: object
      required: [report, samples]
      properties:
        report: { type: string, const: report.json }
        samples:
          type: array
          maxItems: 4
          items: { type: string, pattern: "^[0-9a-f]{16}\\.png$" }

    PipelineErrorDiagnostic:
      type: object
      required: [schema, code, phase, retryable]
      properties:
        schema: { type: string }
        code: { type: string, minLength: 1, maxLength: 96 }
        phase: { type: string }
        retryable: { type: boolean }
        failed_step: { type: string, nullable: true }
        renderer_backend:
          type: string
          enum: [warp, ovrtx, remote, mock, unknown]
          nullable: true
        checked_count: { type: integer, minimum: 1, maximum: 1000000, nullable: true }
        blank_count: { type: integer, minimum: 1, maximum: 1000000, nullable: true }
        blank_ratio: { type: number, minimum: 0, maximum: 1, nullable: true }
        threshold: { type: number, minimum: 0, maximum: 1, nullable: true }
        render_modes:
          type: array
          maxItems: 6
          items: { type: string }
        samples:
          type: array
          maxItems: 4
          items: { type: object }
        evidence:
          oneOf:
            - { $ref: "#/components/schemas/DiagnosticEvidenceNames" }
            - { type: "null" }

    FailureEvidenceFile:
      type: object
      required: [name, url]
      properties:
        name: { type: string }
        url: { type: string }

    FailureEvidence:
      type: object
      required: [report, samples, retention]
      properties:
        report: { $ref: "#/components/schemas/FailureEvidenceFile" }
        samples:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/FailureEvidenceFile" }
        retention:
          type: string
          const: until_session_expiry_or_deletion

    PipelineStatus:
      type: object
      properties:
        session_id: { type: string }
        status:
          type: string
          enum: [pending, running, completed, failed, cancelled, cancelling]
        current_step:
          type: object
          nullable: true
          properties:
            name: { type: string }
            display_name: { type: string }
            started_at: { type: string, format: date-time }
            progress:
              type: object
              properties:
                current: { type: integer }
                total: { type: integer }
                percent: { type: integer }
                message: { type: string }
            elapsed_seconds: { type: integer }
        completed_steps:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              display_name: { type: string }
              started_at: { type: string, format: date-time }
              completed_at: { type: string, format: date-time }
              duration_seconds: { type: integer }
              stats: { type: object }
        overall_progress:
          type: object
          properties:
            current_step: { type: integer }
            total_steps: { type: integer }
            percent: { type: integer }
            estimated_remaining_seconds: { type: integer, nullable: true }
        preview_images:
          type: array
          items: { type: string }
        can_cancel: { type: boolean }
        elapsed_seconds: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        coverage:
          oneOf:
            - { $ref: "#/components/schemas/MaterialCoverage" }
            - { type: "null" }
        error: { type: string, nullable: true }
        failed_step: { type: string, nullable: true }
        error_diagnostic:
          oneOf:
            - { $ref: "#/components/schemas/PipelineErrorDiagnostic" }
            - { type: "null" }
        failure_evidence:
          oneOf:
            - { $ref: "#/components/schemas/FailureEvidence" }
            - { type: "null" }

    PipelineResults:
      type: object
      properties:
        session_id: { type: string }
        status: { type: string, example: completed }
        stats:
          type: object
          properties:
            original_prim_count: { type: integer }
            prims_processed: { type: integer }
            images_generated: { type: integer }
            predictions_made: { type: integer }
            materials_applied: { type: integer }
            cluster_prims_ran: { type: boolean }
            cluster_total_prims: { type: integer }
            cluster_count: { type: integer }
            cluster_representative_count: { type: integer }
            cluster_reduction_percent: { type: number }
            cluster_multi_member_count: { type: integer }
            cluster_singleton_count: { type: integer }
            cluster_max_size: { type: integer, nullable: true }
            cluster_capped_count: { type: integer }
        timings:
          type: object
          nullable: true
          properties:
            preparation_seconds: { type: number }
            rendering_total_seconds: { type: number }
            rendering_per_prim_seconds: { type: number }
            prediction_total_seconds: { type: number }
            prediction_per_prim_seconds: { type: number }
            apply_seconds: { type: number }
            total_seconds: { type: number }
        download_urls:
          type: object
          properties:
            output_usd: { type: string }
            predictions: { type: string }
            report: { type: string }
            cluster_map: { type: string }
            cluster_report: { type: string }
            cluster_summary: { type: string }
            cluster_representatives: { type: string }
            scene_manifest: { type: string }
            scene_validation_report: { type: string }
            scene_predictions: { type: string }
            final_render: { type: string }
        duration_seconds: { type: integer }
        completed_at: { type: string, format: date-time }
        coverage:
          oneOf:
            - { $ref: "#/components/schemas/MaterialCoverage" }
            - { type: "null" }

    PipelineError:
      type: object
      properties:
        session_id: { type: string }
        status: { type: string, const: failed }
        error_message: { type: string }
        failed_step: { type: string }
        completed_steps:
          type: array
          items: { type: string }
        partial_results:
          type: object
          nullable: true
          properties:
            stats:
              type: object
              additionalProperties: true
            coverage:
              $ref: "#/components/schemas/MaterialCoverage"
        download_urls:
          type: object
          description: Artifact URLs preserved before failure.
          properties:
            output_usd: { type: string }
            predictions: { type: string }
            report: { type: string }
            cluster_map: { type: string }
            cluster_report: { type: string }
            cluster_summary: { type: string }
            cluster_representatives: { type: string }
            scene_manifest: { type: string }
            scene_validation_report: { type: string }
            scene_predictions: { type: string }
            final_render: { type: string }
        coverage:
          oneOf:
            - { $ref: "#/components/schemas/MaterialCoverage" }
            - { type: "null" }
        error_diagnostic:
          oneOf:
            - { $ref: "#/components/schemas/PipelineErrorDiagnostic" }
            - { type: "null" }
        failure_evidence:
          oneOf:
            - { $ref: "#/components/schemas/FailureEvidence" }
            - { type: "null" }

    MaterialCoverage:
      type: object
      required:
        - schema_version
        - policy
        - readiness_grade
        - target_count
        - prepared_count
        - predicted_count
        - usable_prediction_count
        - unknown_prediction_count
        - fallback_count
        - bound_count
        - unbound_count
        - prediction_coverage_ratio
        - binding_coverage_ratio
        - missing_prepared_prim_ids
        - missing_prediction_prim_ids
        - unknown_prim_ids
        - fallback_prim_ids
        - unbound_prim_ids
        - extra_prediction_prim_ids
        - warnings
      properties:
        schema_version: { type: string, example: "1.0" }
        policy: { type: string, enum: [strict, allow_partial] }
        readiness_grade:
          type: string
          enum: [complete, complete_with_fallback, partial, not_evaluated]
        target_count: { type: integer, minimum: 0 }
        prepared_count: { type: integer, minimum: 0 }
        predicted_count: { type: integer, minimum: 0 }
        usable_prediction_count: { type: integer, minimum: 0 }
        unknown_prediction_count: { type: integer, minimum: 0 }
        fallback_count: { type: integer, minimum: 0 }
        bound_count: { type: integer, minimum: 0 }
        unbound_count: { type: integer, minimum: 0 }
        prediction_coverage_ratio: { type: number, minimum: 0, maximum: 1 }
        binding_coverage_ratio: { type: number, minimum: 0, maximum: 1 }
        missing_prepared_prim_ids:
          type: array
          items: { type: string }
        missing_prediction_prim_ids:
          type: array
          items: { type: string }
        unknown_prim_ids:
          type: array
          items: { type: string }
        fallback_prim_ids:
          type: array
          items: { type: string }
        unbound_prim_ids:
          type: array
          items: { type: string }
        extra_prediction_prim_ids:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }

    PreviewList:
      type: object
      properties:
        session_id: { type: string }
        previews:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              url: { type: string }
              prim_path: { type: string, nullable: true }
              created_at: { type: string, format: date-time }
        total: { type: integer }

    SessionSummary:
      type: object
      properties:
        session_id: { type: string }
        status:
          type: string
          enum: [uploading, ready, pending, running, completed, failed, cancelled]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        elapsed_seconds: { type: integer }
        user_email: { type: string }
        config:
          type: object
          properties:
            has_reference_images: { type: boolean }
            num_reference_images: { type: integer }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Bearer token. The server enforces this ONLY when MATERIAL_AGENT_TOKEN is set in the
        server's environment; when it is unset the service accepts
        unauthenticated requests and every endpoint behaves as if no scheme
        were declared. Send `Authorization: Bearer <token>`. Probe and
        documentation endpoints (`/health`, `/api`, `/`, `/docs`,
        `/openapi.json`) never require a token.

security:
  - {}
  - bearerAuth: []
