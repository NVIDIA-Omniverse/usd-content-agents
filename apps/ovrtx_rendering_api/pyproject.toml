[build-system]
requires = ["setuptools>=68.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ovrtx-rendering-api"
version = "0.1.0"
description = "OVRTX-based USD rendering API service"
requires-python = ">=3.11,<3.13"
dependencies = [
    "usd-cli==0.0.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.11,<3.0.0",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "numpy>=1.26",
    "requests>=2.33.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "httpx>=0.27",
    "ruff>=0.5",
    "tomli>=2.0.1; python_version < '3.11'",
]

[tool.setuptools.packages.find]
include = ["service*"]

[tool.uv.sources]
usd-cli = { path = "../usd_cli", editable = true }
