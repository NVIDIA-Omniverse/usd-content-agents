openapi: 3.1.0
info:
  title: Texture Agent Service
  description: "# Texture Agent Service\n\nFastAPI service for AI-driven texture generation\
    \ on materialized USD assets. Wraps the [Texture Agent](../texture_agent/) pipeline\
    \ behind a REST API with session management, async progress streaming via Server-Sent\
    \ Events (SSE), and Docker-ready deployment.\n\n## Default backends (product-default\
    \ change)\n\nThe service ships with an NVIDIA-first default stack:\n\n| Role |\
    \ Default | Env var | Model |\n|---|---|---|---|\n| Image generation | `nim` |\
    \ `TA_IMAGE_GEN_BACKEND` | `black-forest-labs/flux_2-klein-4b` (build.nvidia.com)\
    \ |\n| Auto-prompt LLM  | `nim` | `TA_LLM_BACKEND`       | `google/gemma-4-31b-it`\
    \ (build.nvidia.com) |\n\nBoth honor `NVIDIA_API_KEY`. One key unlocks the whole\
    \ default path.\n\n> **PBR coherence trade-off \u2014 read before deploying.**\n\
    >\n> The cloud `nim` image-gen endpoint does not accept reference images, so\n\
    > the normal- and roughness-map passes (which otherwise condition on the\n> generated\
    \ albedo) run text-only on the default path. The pipeline still\n> produces a\
    \ full PBR set, but the normal/roughness maps are less coherent\n> with the albedo\
    \ than on a conditioning-capable backend. The pipeline\n> logs one warning per\
    \ run to the service stdout (visible via\n> `docker logs texture-agent-service`)\
    \ so operators can tell at a glance\n> whether a given run went through the text-only\
    \ path.\n>\n> To keep full PBR coherence:\n> - run `docker compose --profile image-gen`\
    \ (local FLUX.2 NIM sidecar \u2014\n>   same model, but exposes `images.edit`\
    \ and supports conditioning), **or**\n> - set `TA_IMAGE_GEN_BACKEND=gemini` or\
    \ `TA_IMAGE_GEN_BACKEND=openai`\n>   (both support img2img, but leave the NVIDIA-only\
    \ stack).\n>\n> See the [root README](../../README.md) system requirements and\n> [`../texture_agent/examples/`](../texture_agent/examples/)\
    \ for the runnable\n> simple image-gen example.\n\n## Quick Start (Docker)\n\n\
    Requires **Docker Compose v2.24+** (for `env_file: required: false` support).\n\
    \n```bash\n# From the repo root -- set your image-gen provider key\n# (NIM or\
    \ Gemini). The compose file reads .env at the repo root\n# via env_file.\necho\
    \ 'NVIDIA_API_KEY=your_key' > .env\n\n# Build and run. `--env-file .env` is required\
    \ so that any `${VAR}`\n# overrides in compose (e.g. `TA_IMAGE_GEN_BACKEND=gemini`)\
    \ read from\n# the repo-root `.env`. Without it, Compose's variable substitution\n\
    # looks for `.env` next to the compose file\n# (`apps/texture_agent_service/.env`)\
    \ and silently falls back to the\n# built-in defaults.\ndocker compose --env-file\
    \ .env \\\n  -f apps/texture_agent_service/docker-compose.yml up --build\n\n#\
    \ Service available at http://localhost:8001\n```\n\nBy default the texture service\
    \ does not start GPU sidecars; texture generation\nruns against the configured\
    \ image-gen backend and cold start is fast.\n\n### Texture Variation API Backend\n\
    \nThe public 0.5 source release ships the service backend contract and the\nStep1X-compatible\
    \ adapter, but does not ship a managed Step1X runtime,\ndownloader/setup package,\
    \ model checkpoints, or runtime cache layout. To use a\nTexture Variation API-compatible\
    \ backend, deploy that backend separately after\nyour own security and legal review,\
    \ then configure Texture Agent to call it:\n\n```bash\nTA_TEXTURE_BACKEND=service\
    \ \\\nTA_TEXTURE_ENDPOINT=http://texture-variation-backend:8000 \\\nTA_BACKEND_ENGINE=step1x\
    \ \\\ndocker compose --env-file .env \\\n  -f apps/texture_agent_service/docker-compose.yml\
    \ \\\n  up --build\n```\n\nUse the optional `docker-compose.step1x.yml` overlay\
    \ only when you have already\nmounted a complete external runtime for `texture-gen-step1x`:\n\
    \n```bash\nTEXTURE_STEP1X_HOST_RUNTIME=/path/to/reviewed/texture-editing-runtime\
    \ \\\ndocker compose --env-file .env \\\n  -f apps/texture_agent_service/docker-compose.yml\
    \ \\\n  -f apps/texture_agent_service/docker-compose.step1x.yml \\\n  up --build\n\
    ```\n\nThat overlay starts the API adapter and OVRTX sidecar, routes\n`TA_TEXTURE_ENDPOINT=http://texture-gen-step1x:8000`,\
    \ and requires the runtime\nto be supplied through `TEXTURE_STEP1X_HOST_RUNTIME`.\
    \ It does not download or\ninstall Step1X, Material Anything, Swin2SR, Kaolin,\
    \ nvdiffrast, or model\ncheckpoints.\n\n## Quick Start (Local Dev)\n\n```bash\n\
    # From repo root\nsource .venv/bin/activate\n\n# Install\nuv pip install -e \"\
    .[dev]\"\nuv pip install -e apps/texture_agent -e apps/texture_agent_service\n\
    \n# Configure\ncp .env_example .env\n# Edit .env to set NVIDIA_API_KEY or GOOGLE_API_KEY\n\
    \n# Run\ntexture-agent-service\n# or: uvicorn service.main:app --host 0.0.0.0\
    \ --port 8001\n```\n\n## API\n\n- **Interactive docs:** http://localhost:8001/docs\
    \ (Swagger UI) once the service is running.\n- **Full reference:** [`docs/api.md`](docs/api.md).\n\
    - **Brev deployment planning:** [`docs/brev.md`](docs/brev.md).\n- **OpenAPI spec:**\
    \ [`openapi.yaml`](openapi.yaml).\n\nThe pipeline endpoints (`POST /pipeline/upload-usd`,\
    \ `POST /pipeline`, `GET /pipeline/{id}/status`, etc.) accept a materialized USD\
    \ file (typically the output of the Material Agent) and a per-material texture\
    \ prompt map, then run the texture discovery / generation / apply pipeline. Stream\
    \ real-time progress over SSE at `GET /pipeline/{id}/events`. Download textured\
    \ output USDZ, textures, and the run manifest via `/artifacts/{id}/output`, `/artifacts/{id}/textures`,\
    \ and `/artifacts/{id}/manifest`.\n\nFor release validation, the service path should\
    \ agree with the CLI path on the\nprimary ladder fixture: four discovered materials,\
    \ one generated texture set\nwhen only `Aluminum_Matte` is provided in `material_textures_json`\
    \ with\n`auto_prompt_enabled=false`, matching output USD counts, and the same\
    \ UV/report\ndiagnostics. Omitting `auto_prompt_enabled` preserves the service's\
    \ legacy\nauto-prompting behavior. The repeatable fake-backend smoke test is\n\
    `apps/texture_agent_service/tests/unit/test_issue31_validation_smoke.py`;\nreal\
    \ NIM/Gemini service runs should be recorded as manual evidence, not as the\n\
    only gate.\n\n### Session Cleanup\n\nLong-lived deployments should delete sessions\
    \ after downloading required artifacts so session storage does not grow indefinitely:\n\
    \n```bash\ncurl -X DELETE http://localhost:8001/sessions/$SESSION_ID\n```\n\n\
    `DELETE /sessions/{session_id}` returns `204 No Content` when the session, stored\
    \ artifacts, and in-memory progress state are removed. It returns JSON `404 Not\
    \ Found` when the session does not exist, and JSON `409 Conflict` when a live\
    \ pipeline job is still active or a worker lock shows artifact writes are still\
    \ in progress; cancel the pipeline and wait for the worker to stop before deleting\
    \ it. If a service restart leaves a persisted `cancelling` status with no live\
    \ worker lock, deletion is allowed so stale artifacts can be cleaned up.\n\n###\
    \ Artifact Response Types\n\nThe `/artifacts/{session_id}/...` routes use per-kind\
    \ response media types:\n\n| Endpoint | Success media type | Payload |\n|----------|--------------------|---------|\n\
    | `GET /artifacts/{session_id}/materials` | `application/json` | Discovered material\
    \ metadata |\n| `GET /artifacts/{session_id}/manifest` | `application/json` |\
    \ Schema-versioned artifact manifest |\n| `GET /artifacts/{session_id}/textures`\
    \ | `application/zip` | ZIP containing generated textures under `textures/` |\n\
    | `GET /artifacts/{session_id}/textures/{filename}` | `image/png` | Single texture\
    \ image |\n| `GET /artifacts/{session_id}/output` | `model/vnd.usdz+zip` | Self-contained\
    \ textured USDZ |\n| `GET /artifacts/{session_id}/renders` | `application/zip`\
    \ | ZIP containing final rendered images under `renders/` |\n| `GET /artifacts/{session_id}/renders/{filename}`\
    \ | `image/png` | Single render image |\n| `GET /artifacts/{session_id}/preview/{filename}`\
    \ | `image/png` | Single material preview image |\n\nError responses, including\
    \ missing artifacts, are JSON.\n\n## Python Client\n\n```python\nfrom client.client\
    \ import TextureAgentClient\n\nclient = TextureAgentClient(\"http://localhost:8001\"\
    )\n\n# Upload and run\nsession_id, status = client.run_and_monitor(\n    usd_path=\"\
    scene.usd\",\n    material_textures={\n        \"Steel_Carbon\": {\n         \
    \   \"prompt\": \"rusted steel\",\n            \"opacity\": 0.85,\n        },\n\
    \    },\n    auto_prompt_enabled=False,  # strict material_textures scope\n)\n\
    \n# Download artifacts\nclient.download_output(session_id, \"output.usdz\")\n\
    client.download_textures(session_id, \"./textures/\")\n\n# Delete the session\
    \ after required artifacts are downloaded\nclient.delete_session(session_id)\n\
    ```\n\nThe bundled CLI exits with status `0` only after the final pipeline status\
    \ is\n`completed`. Scripted callers that intentionally stop client polling early\n\
    should keep the printed session ID and poll `GET /pipeline/{id}/status` before\n\
    deciding whether a nonzero client exit is a hard failure.\n\nProjection backend\
    \ runs use the same client helper with the `service` texture\nbackend and an endpoint.\
    \ Global conditioning is merged with material-specific\nconditioning before each\
    \ Issue #116 texture variation request:\n\n```python\nsession_id, status = client.run_and_monitor(\n\
    \    usd_path=\"ladder.usd\",\n    material_textures={\n        \"Aluminum_Matte\"\
    : {\n            \"prompt\": \"matte aluminum\",\n            \"reference_image_uris\"\
    : [\"file:///refs/aluminum.png\"],\n        },\n    },\n    auto_prompt_enabled=False,\n\
    \    texture_backend=\"service\",\n    texture_endpoint=\"http://localhost:8011\"\
    ,\n    backend_engine=\"fake_projection\",\n    backend_custom_parameters={\"\
    variant\": \"success_full_pbr\"},\n    reference_image_uris=[\"file:///refs/ladder.png\"\
    ],\n    reference_image_path=\"reference.png\",\n    multiview_image_uris=[\"\
    file:///refs/view0.png\"],\n    seed=11631,\n    strength=0.8,\n    strict_scope=True,\n\
    )\n```\n\nFor AOI, CAD, PCB, or SimReady-style assets where traces, vias, pads,\
    \ labels,\nholes, seams, components, or markings already exist as modeled geometry,\
    \ pass\n`detail_policy=\"surface_only\"` globally or set `detail_policy` inside\
    \ a material\nor per-prim entry in `material_textures`. This adds conservative\
    \ prompt\nconditioning for simple image generation and passes policy metadata\
    \ to\nprojection backends.\n\nFor the command-line client wrapper, pass `--disable-auto-prompt`\
    \ to send\n`auto_prompt_enabled=false` and keep the run scoped to `material_textures`.\n\
    Use `--detail-policy surface_only` for the global conservative/AOI policy.\n\n\
    ## Configuration\n\nService configuration is loaded from environment variables\
    \ at startup. Key\nsettings are below. Docker Compose packages may set topology-specific\
    \ overrides\nsuch as external Texture Variation API or OVRTX sidecar endpoints.\n\
    \n| Variable | Default | Description |\n|----------|---------|-------------|\n\
    | `NVIDIA_API_KEY` | - | API key for NIM image generation |\n| `GOOGLE_API_KEY`\
    \ | - | API key for Gemini image generation |\n| `TA_TEXTURE_BACKEND` | `simple_image_gen`\
    \ | Texture gen backend |\n| `TA_TEXTURE_ENDPOINT` | - | Default Texture Variation\
    \ API endpoint when `TA_TEXTURE_BACKEND=service` |\n| `TA_BACKEND_ENGINE` | -\
    \ | Default Texture Variation API engine/model hint, e.g. `step1x` |\n| `TA_IMAGE_GEN_BACKEND`\
    \ | `nim` | Image gen backend (`nim`, `gemini`, `openai`) |\n| `TA_IMAGE_GEN_BASE_URL`\
    \ | - | Override image-gen base URL; used by the multi-gpu overlay to route to\
    \ the local FLUX sidecar |\n| `TA_IMAGE_GEN_API_KEY` | - | Endpoint-specific image-gen\
    \ key; the local NIM overlay sets `not-used` in Compose |\n| `TA_TEXTURE_SIZE`\
    \ | `1024` | Texture resolution |\n| `TA_TEXTURE_WORKERS` | `4` | Parallel gen\
    \ workers |\n| `TA_TEXTURE_JOB_TIMEOUT_SEC` | `3600` | Per-material service backend\
    \ wait timeout; raise for slow Step1X GPU jobs |\n| `TA_AUTO_PROMPT_MAX_GENERATED_MATERIALS`\
    \ | `64` | Maximum missing materials auto-prompt may select before requiring explicit\
    \ scope; `0` disables the guard |\n| `TA_TEXTURE_PLAN_DEFAULT_CAP` | `32` | Generic/simple-image-gen\
    \ planning default from `texture-agent-plan.v1` |\n| `TA_TEXTURE_PLAN_UV_AWARE_DEFAULT_CAP`\
    \ | `16` | UV-aware/service and Step1X planning default from `texture-agent-plan.v1`\
    \ |\n| `TA_TEXTURE_PLAN_HARD_CAP` | `64` | Immutable planning maximum; plans above\
    \ it require consolidation or narrower scope before backend work |\n| `TA_MAX_TEXTURE_UNITS`\
    \ | `64` | Compatibility executor guard from issue #463; keep aligned with the\
    \ planning hard cap. It is not the normal selection default |\n| `TA_BLEND_OPACITY`\
    \ | `0.85` | Default blend opacity |\n| `TA_UV_POLICY` | `generate_missing` |\
    \ UV prep policy for service-created pipelines (`generate_missing`, `force_projection`,\
    \ etc.) |\n| `TA_UV_SCOPE` | `stage` | UV preparation scope; use `target_prims`\
    \ only with explicit prim targets |\n| `TA_UV_BACKEND` | `python` | UV prep backend\
    \ |\n| `TA_UV_PROJECTION` | `box` | Projection mode used when UVs are generated\
    \ |\n| `TA_UV_OVERWRITE_EXISTING` | `false` | Whether generated UVs overwrite\
    \ existing UV primvars |\n| `TA_UV_REBAKE_SOURCE_ALBEDO` | `false` | Rebake source\
    \ albedo when scoped projection UVs are generated |\n| `TA_UV_REBAKE_SIZE` | -\
    \ | Optional source texture rebake resolution |\n| `TA_UV_NORMALIZE_OUT_OF_RANGE`\
    \ | `false` | Whether out-of-range UVs are normalized during UV prep |\n| `TA_RENDER_ENABLED`\
    \ | `false` | Enable final render step for service-created pipelines |\n| `RENDER_ENDPOINT`\
    \ | - | Remote renderer endpoint used by final render tasks |\n| `TEXTURE_STEP1X_HOST_RUNTIME`\
    \ | - | Host runtime directory for the optional external Step1X-compatible adapter\
    \ overlay |\n| `TEXTURE_GEN_SIMPLE_ENV_FILE` | `/dev/null` | Optional extra env\
    \ file for the simple sidecar, useful when provider keys live outside this checkout\
    \ |\n| `TEXTURE_STEP1X_GPU_DEVICE` | `0` | GPU device ID for the Step1X sidecar\
    \ |\n| `OVRTX_GPU_DEVICE` | `1` | GPU device ID for the OVRTX sidecar; set both\
    \ GPU vars to `0` on one-GPU hosts |\n| `TEXTURE_STEP1X_PYTHON` | - | Advanced\
    \ override for custom mounted runtimes |\n| `TEXTURE_STEP1X_LD_LIBRARY_PATH` |\
    \ reference `.venv_gen` torch/CUDA libs | Advanced override when a custom mounted\
    \ runtime stores CUDA libraries outside the reference layout |\n| `TEXTURE_STEP1X_HEALTHCHECK_RUNTIME_IMPORTS`\
    \ | readiness healthcheck `true` | Enables cached torch/CuPy/NVRTC runtime preflight\
    \ when `healthcheck.py` checks `/health` |\n| `TEXTURE_STEP1X_HEALTHCHECK_TIMEOUT`\
    \ | `180s` | Docker healthcheck timeout; relevant to cold runtime imports only\
    \ for readiness healthchecks |\n| `TA_RENDER_PREVIEWS_ENABLED` | `false` | Enable\
    \ material preview render step |\n| `TA_RENDER_IMAGE_WIDTH` / `TA_RENDER_IMAGE_HEIGHT`\
    \ | `1024` / `1024` | Final render dimensions |\n| `TA_RENDER_PREVIEW_IMAGE_WIDTH`\
    \ / `TA_RENDER_PREVIEW_IMAGE_HEIGHT` | `512` / `512` | Material preview render\
    \ dimensions |\n| `TA_SESSION_STORAGE_PATH` | `/var/texture-agent/sessions` |\
    \ Session storage |\n| `TA_SESSION_TTL_HOURS` | `24` | Session expiry |\n| `TA_STORAGE_KIND`\
    \ | `local` | Session store backend (`local` or `s3`) |\n| `TA_STORAGE_S3_BUCKET`\
    \ | `WU_S3_BUCKET` | S3 bucket for shared sessions |\n| `TA_STORAGE_S3_PREFIX`\
    \ | - | Prefix for shared session objects |\n| `TA_STORAGE_S3_REGION` | `WU_S3_REGION`\
    \ | S3 region |\n| `TA_STORAGE_S3_PROFILE` | `WU_S3_PROFILE` | Optional AWS profile\
    \ for local/dev runs |\n| `TA_STORAGE_S3_ENDPOINT_URL` | - | Optional S3-compatible\
    \ endpoint URL |\n| `TA_STORAGE_S3_PRESIGN` | `true` | Return presigned artifact\
    \ URLs when possible |\n| `TA_STORAGE_S3_MAX_POOL_CONNECTIONS` | `64` | S3 client\
    \ connection pool size |\n| `TA_MAX_ACTIVE_SESSIONS` | `4` | Max concurrent pipelines,\
    \ read when the registry starts. Invalid or negative values fall back to `4`; `0` permits\
    \ no active executions. |\n| `TA_CANCEL_DRAIN_TIMEOUT_SECONDS` | `30.0` | Seconds a cancelled request\
    \ waits for a synchronous worker thread to stop before marking the session failed\
    \ with a stalled-worker deletion guard |\n| `TA_MAX_UPLOAD_SIZE_MB` | `500` |\
    \ Max USD upload size |\n\nFor multi-instance deployments, use `TA_STORAGE_KIND=s3`\
    \ and configure the S3\nbucket, prefix, region, and credentials before increasing\
    \ replicas. Local\nstorage is single-instance only because each pod sees only\
    \ its own session\ndirectory. The Helm chart exposes the same settings under `sessionStorage.*`;\n\
    keep `replicaCount: 1` unless `sessionStorage.kind` is `s3`. If both explicit\n\
    S3 credentials and `TA_STORAGE_S3_PROFILE` are configured, the explicit\ncredentials\
    \ take precedence; if the named profile is unavailable, the service\nfalls back\
    \ to the default boto3 credential chain.\n\n## Project Structure\n\n```\ntexture_agent_service/\n\
    \u251C\u2500\u2500 client/                     # Python client (client.py)\n\u251C\
    \u2500\u2500 docs/                       # Documentation (api.md REST reference)\n\
    \u251C\u2500\u2500 service/                    # FastAPI app, routers, runtime,\
    \ storage\n\u251C\u2500\u2500 tests/                      # Test suite\n\u251C\
    \u2500\u2500 docker-compose.yml          # Docker Compose\n\u251C\u2500\u2500\
    \ Dockerfile                  # Service image\n\u251C\u2500\u2500 openapi.yaml\
    \                # API specification\n\u2514\u2500\u2500 pyproject.toml      \
    \        # Install metadata\n```\n"
  version: 0.5.2
paths:
  /pipeline/upload-usd:
    post:
      tags:
      - pipeline
      summary: Upload Usd Immediate
      description: 'Upload a USD file and create a session for later pipeline execution.


        Provide exactly one of these two input modes:

        1. **File upload**: Provide ``usd_file`` (multipart).

        2. **S3 reference**: Provide ``s3_uri`` -- the service downloads server-side.


        Client S3 access is fail-closed: the exact bucket name must be listed in

        ``TA_S3_ALLOWED_BUCKETS``, and an empty allowlist rejects every client S3 URI

        before session-manager or S3 I/O.


        Use the returned session_id with ``POST /pipeline`` to start processing.'
      operationId: upload_usd_immediate_pipeline_upload_usd_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_usd_immediate_pipeline_upload_usd_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreated'
        '400':
          description: Missing, conflicting, or invalid input source, including an unsupported USD extension.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '403':
          description: Client S3 URI rejected by the configured bucket allowlist, or S3 access denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /pipeline:
    post:
      tags:
      - pipeline
      summary: Create Pipeline
      description: 'Create and execute a texture generation pipeline.


        Provide at least one of these three input modes:

        1. **Existing session**: Provide ``session_id`` (from ``/upload-usd``).

        2. **S3 reference**: Provide ``s3_uri``, downloads from S3 server-side.

        3. **File upload**: Provide ``usd_file``, creates new session.


        When multiple sources are supplied, selection follows the legacy precedence

        ``session_id`` > ``s3_uri`` > ``usd_file`` and lower-priority fields are

        ignored. A selected S3 source is admitted only when its exact bucket name is

        listed in ``TA_S3_ALLOWED_BUCKETS``; an empty allowlist rejects every client

        S3 input before session-manager or S3 I/O.


        Optionally provide ``material_textures_json`` to specify per-material

        texture prompts, blend opacity, and per-prim overrides.'
      operationId: create_pipeline_pipeline_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_create_pipeline_pipeline_post'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionCreated'
        '400':
          description: Missing, conflicting, or invalid input source, including an unsupported USD extension.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '403':
          description: Client S3 URI rejected by the configured bucket allowlist, or S3 access denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /pipeline/{session_id}/plan:
    get:
      tags:
      - pipeline
      summary: Get Pipeline Plan
      description: Return the validated immutable texture plan when planning is complete.
      operationId: get_pipeline_plan_pipeline__session_id__plan_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TexturePlan'
        '404':
          content:
            application/json:
              schema: {}
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /pipeline/{session_id}/status:
    get:
      tags:
      - pipeline
      summary: Get Pipeline Status
      description: 'Get pipeline execution status with detailed progress.


        Uses the same merged disk+bus view as ``/sessions/{sid}`` so the two

        endpoints agree on every observable field for the same session, even

        when the executor''s outer exception handler persists a terminal disk

        status without emitting a corresponding bus event.'
      operationId: get_pipeline_status_pipeline__session_id__status_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /pipeline/{session_id}/results:
    get:
      tags:
      - pipeline
      summary: Get Pipeline Results
      description: 'Get pipeline execution results (only available when completed).


        Reads from the same merged disk+bus view as ``/sessions/{sid}`` and

        ``/pipeline/{sid}/status``: when the bus has reached a terminal status

        but ``_persist_status`` hasn''t yet awaited its disk write, a disk-only

        read here would briefly return 202 ("still running") while the other

        two endpoints already report "completed".'
      operationId: get_pipeline_results_pipeline__session_id__results_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PipelineResults'
                - $ref: '#/components/schemas/PipelineError'
                title: Response Get Pipeline Results Pipeline  Session Id  Results
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /pipeline/{session_id}/cancel:
