components:
  schemas:
    ErrorDetail:
      properties:
        detail:
          type: string
          title: Detail
          description: Human-readable error detail
      type: object
      required:
      - detail
      title: ErrorDetail
      description: Standard FastAPI error payload returned by input failures.
    Body_create_pipeline_pipeline_post:
      properties:
        usd_file:
          anyOf:
          - type: string
            contentMediaType: application/octet-stream
          - type: 'null'
          title: Usd File
          description: Lowest-priority USD source. Used only when session_id and s3_uri
            are both omitted.
        reference_image_file:
          anyOf:
          - type: string
            contentMediaType: application/octet-stream
          - type: 'null'
          title: Reference Image File
          description: Optional global reference image upload for projection backend
            conditioning. Added to reference_image_uris.
        session_id:
          type: string
          title: Session Id
          description: 'Highest-priority source: an existing session ID from /upload-usd.
            When provided, s3_uri and usd_file are ignored.'
        s3_uri:
          type: string
          title: S3 Uri
          description: Second-priority source, used when session_id is omitted. Its
            exact bucket name must be listed in TA_S3_ALLOWED_BUCKETS; an empty allowlist
            rejects all selected client S3 inputs before session-manager or S3 I/O.
            When selected, usd_file is ignored.
        material_textures_json:
          type: string
          title: Material Textures Json
          description: 'Per-material texture config JSON. Shape: {"Material": {"prompt":
            "rusted steel", "opacity": 0.85, "per_prim": {"/World/Prim": {"prompt":
            "scratches", "opacity": 0.65}}}}. Material prompt is required and non-empty,
            opacity is optional and bounded to 0.0-1.0, unknown fields are rejected,
            and any per_prim entry runs the request in per-prim texture mode.'
          default: ''
        user_prompt:
          type: string
          title: User Prompt
          description: Aesthetic direction for auto-prompt generation (e.g. 'old and
            weathered'). Used to auto-generate prompts for materials not covered by
            material_textures_json.
          default: ''
        auto_prompt_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Auto Prompt Enabled
          description: Whether to auto-generate prompts for discovered materials missing
            from material_textures_json. Defaults to true for legacy service behavior;
            set false for strict material_textures_json scope.
        texture_backend:
          anyOf:
          - type: string
          - type: 'null'
          title: Texture Backend
          description: Texture backend override, for example 'service'.
        texture_endpoint:
          anyOf:
          - type: string
          - type: 'null'
          title: Texture Endpoint
          description: Texture variation backend endpoint for texture_backend='service'.
        backend_engine:
          anyOf:
          - type: string
          - type: 'null'
          title: Backend Engine
          description: Projection backend engine/model route hint.
        backend_custom_parameters_json:
          type: string
          title: Backend Custom Parameters Json
          description: Backend custom parameters JSON object.
          default: ''
        detail_policy:
          anyOf:
          - $ref: '#/components/schemas/TextureDetailPolicy-Input'
          - type: 'null'
          description: Texture detail policy. Use 'surface_only' for AOI/CAD assets
            where traces, labels, holes, seams, or other semantic details already
            exist as geometry and textures should stay limited to subtle material
            surface variation.
        reference_image_uris_json:
          type: string
          title: Reference Image Uris Json
          description: Global reference image URI JSON list.
          default: ''
        turntable_video_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Turntable Video Uri
          description: Global turntable video URI for projection backend conditioning.
        multiview_image_uris_json:
          type: string
          title: Multiview Image Uris Json
          description: Global multi-view image URI JSON list.
          default: ''
        seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed
          description: Texture backend seed override.
        strength:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Strength
          description: Texture edit strength override.
        strict_scope:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Strict Scope
          description: Whether projection backend requests must preserve selected
            scope.
        uv_policy:
          anyOf:
          - type: string
          - type: 'null'
          title: Uv Policy
          description: UV preparation policy override, for example 'force_projection'
            for UV-aware texture backends.
        uv_scope:
          anyOf:
          - type: string
          - type: 'null'
          title: Uv Scope
          description: UV projection scope override, for example 'target_prims'.
        uv_backend:
          anyOf:
          - type: string
          - type: 'null'
          title: Uv Backend
          description: UV preparation backend override.
        uv_projection:
          anyOf:
          - type: string
          - type: 'null'
          title: Uv Projection
          description: UV projection mode override, for example 'box'.
        uv_overwrite_existing:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Uv Overwrite Existing
          description: Whether UV preparation may overwrite existing UV coordinates.
        uv_rebake_source_albedo:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Uv Rebake Source Albedo
          description: Whether scoped UV projection should rebake source albedo, normal,
            and ORM maps into the generated UV layout.
        uv_rebake_size:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Uv Rebake Size
          description: Optional scoped source texture rebake resolution.
        uv_normalize_out_of_range:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Uv Normalize Out Of Range
          description: Whether UV preparation should normalize out-of-range UVs.
        render_timeout_sec:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Render Timeout Sec
          description: Optional final render request timeout in seconds. Texture generation
            and USD packaging can still complete when the renderer is unavailable
            or slow.
        plan_only:
          type: boolean
          title: Plan Only
          description: Discover and persist texture_plan.json without invoking prompt,
            image-generation, application, or render backends.
          default: false
        discovery_mode:
          $ref: '#/components/schemas/TextureDiscoveryMode'
          description: 'Planning scope: effective_bound, explicit, or all_authored.'
          default: effective_bound
        unit_mode:
          anyOf:
          - $ref: '#/components/schemas/TextureUnitMode'
          - type: 'null'
          description: 'Planning unit mode: per_material, per_group, or per_prim.'
        explicit_material_paths_json:
          type: string
          title: Explicit Material Paths Json
          description: JSON list of absolute material paths for explicit discovery.
          default: ''
        explicit_prim_paths_json:
          type: string
          title: Explicit Prim Paths Json
          description: JSON list of absolute prim/subset paths for explicit discovery.
          default: ''
        operator_override_cap:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Operator Override Cap
          description: Intentional generation-unit cap override. Values above the
            backend default and no greater than 64 are recorded in the plan.
      type: object
      title: Body_create_pipeline_pipeline_post
    Body_upload_usd_immediate_pipeline_upload_usd_post:
      properties:
        usd_file:
          anyOf:
          - type: string
            contentMediaType: application/octet-stream
          - type: 'null'
          title: Usd File
          description: USD file to upload. Provide exactly one of usd_file or s3_uri.
        s3_uri:
          type: string
          title: S3 Uri
          description: S3 URI to a USD file. Its exact bucket name must be listed
            in TA_S3_ALLOWED_BUCKETS; an empty allowlist rejects all client S3 inputs.
            Provide exactly one of usd_file or s3_uri.
      type: object
      title: Body_upload_usd_immediate_pipeline_upload_usd_post
    CompletedStepInfo:
      properties:
        name:
          type: string
          title: Name
          description: Step internal name
        display_name:
          type: string
          title: Display Name
          description: Human-readable step name
        started_at:
          type: string
          title: Started At
          description: ISO timestamp when step started
        completed_at:
          type: string
          title: Completed At
          description: ISO timestamp when step completed
        duration_seconds:
          type: integer
          title: Duration Seconds
          description: Step duration in seconds
        stats:
          additionalProperties: true
          type: object
          title: Stats
          description: Step-specific statistics
      type: object
      required:
      - name
      - display_name
      - started_at
      - completed_at
      - duration_seconds
      title: CompletedStepInfo
      description: Information about a completed step.
    CurrentStepInfo:
      properties:
        name:
          type: string
          title: Name
          description: Step internal name
        display_name:
          type: string
          title: Display Name
          description: Human-readable step name
        started_at:
          type: string
          title: Started At
          description: ISO timestamp when step started
        progress:
          $ref: '#/components/schemas/StepProgress'
        elapsed_seconds:
          type: integer
          title: Elapsed Seconds
          description: Seconds since step started
      type: object
      required:
      - name
      - display_name
      - started_at
      - progress
      - elapsed_seconds
      title: CurrentStepInfo
      description: Information about the currently executing step.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    MaterialTextureOverride:
      properties:
        prompt:
          type: string
          minLength: 1
          title: Prompt
        opacity:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Opacity
        detail_policy:
          anyOf:
          - $ref: '#/components/schemas/TextureDetailPolicy-Input'
          - type: 'null'
        material_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Material Path
        prim_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Prim Path
        prim_paths:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Prim Paths
        reference_image_uris:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Reference Image Uris
        turntable_video_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Turntable Video Uri
        multiview_image_uris:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Multiview Image Uris
        per_prim:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/PrimTextureOverride'
            type: object
          - type: 'null'
          title: Per Prim
      additionalProperties: false
      type: object
      required:
      - prompt
      title: MaterialTextureOverride
      description: Per-material texture prompt/opacity override accepted by the API.
    OverallProgress:
      properties:
        current_step:
          type: integer
          title: Current Step
          description: Current step number (1-indexed)
        total_steps:
          type: integer
          title: Total Steps
          description: Total number of steps
        percent:
          type: integer
          title: Percent
          description: Overall percentage complete (0-100)
        estimated_remaining_seconds:
          anyOf:
          - type: integer
          - type: 'null'
          title: Estimated Remaining Seconds
          description: Estimated seconds until completion
      type: object
      required:
      - current_step
      - total_steps
      - percent
      title: OverallProgress
      description: Overall pipeline progress.
    PipelineError:
      properties:
        session_id:
          type: string
          title: Session Id
        status:
          type: string
          title: Status
          default: failed
        error_message:
          type: string
          title: Error Message
          description: Error description
        failed_step:
          type: string
          title: Failed Step
          description: Step that failed
        completed_steps:
          items:
            type: string
          type: array
          title: Completed Steps
          description: Steps completed before failure
        partial_results:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Partial Results
          description: Partial results if available
        failed_step_stats:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Failed Step Stats
          description: Stats from the failed step at the moment it raised, including
            any structured per-unit errors (e.g. ``errors`` and ``textures_failed``
            for texture-generation/blend steps). Lets REST consumers without an SSE
            subscription diagnose threshold-gated failures without grepping container
            logs.
      type: object
      required:
      - session_id
      - error_message
      - failed_step
