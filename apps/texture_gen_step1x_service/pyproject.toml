[project]
name = "texture-gen-step1x-service"
dynamic = ["version"]
description = "Optional Step1X Texture Variation API service"
requires-python = ">=3.12"
authors = [
    {name = "Omniverse GenAI Team"},
]

dependencies = [
    "fastapi>=0.115.8",
    "starlette>=1.3.1,<2.0.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.9.0",
    "Pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "world-understanding>=0.4.2",
    "texture-gen-service-common>=0.4.2",
]

[tool.uv.sources]
world-understanding = { path = "../..", editable = true }
texture-gen-service-common = { path = "../texture_gen_service_common", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling<1.27.0", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.uv-dynamic-versioning]
enable = true
vcs = "git"
pattern = "default-unprefixed"
fallback-version = "0.5.2"
from-file = { source = "../../VERSION.md" }

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "apps/texture_gen_step1x_service/__init__.py"
"app.py" = "apps/texture_gen_step1x_service/app.py"
"backend.py" = "apps/texture_gen_step1x_service/backend.py"
"README.md" = "apps/texture_gen_step1x_service/README.md"
"scripts/smoke.py" = "apps/texture_gen_step1x_service/scripts/smoke.py"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["internal/texture_editing_runtime"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "E501",
]
