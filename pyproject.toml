[project]
name = "world-understanding"
dynamic = ["version"]
description = "Python library for Vision-Language Agents with computer vision tools"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Omniverse GenAI Team"},
]

dependencies = [
    "setuptools>=80.9.0",
    "pydantic>=2.11,<3.0.0",
    "pydantic-settings>=2.0.0",
    "typer==0.16.1",
    "rich>=14.0,<15.0.0",
    "pyyaml==6.0.2",
    "ruamel.yaml==0.18.6",
    "numpy>=2.3,<3.0.0",
    "scikit-learn==1.7.2",
    "scipy==1.16.1",
    "pillow>=12.1.1,<13.0.0",
    "aiofiles==24.1.0",
    "httpx>=0.27.0",
    # Floor lifted for GHSA-gc5v-m9x4-r6x2 (temp file reuse in
    # extract_zipped_paths).
    "requests>=2.33.0",
    # Floor lifted for CVE-2026-44431 / CVE-2026-44432 (urllib3 HTTP
    # response-handling issues).
    # urllib3 is otherwise transitive through requests/botocore and can resolve
    # to vulnerable releases.
    "urllib3>=2.7.0,<3.0.0",
    # Floors lifted for high source-scan findings in transitive auth/telemetry
    # deps: pyasn1 DoS decoder issues (GHSA-jr27-m4p2-rc6r,
    # GHSA-63vm-454h-vhhq) and protobuf JSON recursion bypass
    # (GHSA-7gcm-g887-7qv7).
    "pyasn1>=0.6.3,<1.0.0",
    "protobuf>=6.33.6,<7.0.0",
    "python-dotenv==1.2.2",
    # Floor lifted for GHSA-w853-jp5j-5j7f and GHSA-qmgc-5h2g-mvrw
    # (TOCTOU/symlink handling in SoftFileLock).
    "filelock>=3.20.3",
    # Floor lifted for GHSA-r7w7-9xr2-qq2r (image token counting SSRF
    # protection bypass via DNS rebinding).
    "langchain-openai>=1.1.14,<2.0.0",
    # Floor lifted for GHSA-gr75-jv2w-4656 (path traversal and sandbox escape
    # in file-search middleware and loaders).
    "langchain-anthropic>=1.4.6,<2.0.0",
    "langchain-google-genai>=4.2.0,<5.0.0",
    # Black Duck reports 1.4.1 as the BDSA-2026-10450 fixed release. Keep the
    # consumer floor at the reviewed 1.4.3 resolution so wheel/sdist and
    # lowest-resolution installs cannot drift behind the release evidence.
    "langchain-nvidia-ai-endpoints>=1.4.3,<2.0.0",
    # Floor lifted for CVE-2025-68664 / CVE-2026-44843 and
    # BDSA-2026-10450 (LangChain unsafe deserialization issues). This also
    # stays above the CVE-2026-34070 path-traversal fixed version.
    # The langchain-* packages allow very old langchain-core releases, so the
    # floor is pinned explicitly.
    "langchain-core>=1.4.9,<2",
    # Floors lifted for GHSA-3644-q5cj-c5c7 in prompt manifest handling and
    # GHSA-f4xh-w4cj-qxq8 in TracingMiddleware attachment handling.
    "langsmith>=0.8.18,<1.0.0",
    "faiss-cpu==1.12.0",
    "gradio_client==1.12.1",
    "boto3>=1.35.0,<2.0.0",
    "websocket-client==1.8.0",
    # usd-exchange provides the pxr/OpenUSD bindings used by the project.
    # Its wheels may omit pxr.UsdVol; traversal filters fall back to
    # exact typeName matching for concrete UsdVol schemas.
    "usd-exchange>=2.3,<3",
    "usd-search-client==1.2.0",
    "google-genai>=1.56.0,<2.0.0",
    "pypdfium2>=4.30.0",
    "usd-validation-nvidia>=1.19.3",
    "opencv-python-headless>=4.8.0",
    # OpenTelemetry API + SDK are imported unconditionally at module load
    # (world_understanding.tools.base, world_understanding.telemetry.*).
    # Keep them in core deps so `import world_understanding` works without
    # the [telemetry] extra; exporters stay in [telemetry].
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]

[project.optional-dependencies]
dev = [
    # pytest >=9.0.3 fixes CVE-2025-71176 (TOCTOU symlink race).
    # pytest-asyncio >=1.3.0 is required for pytest 9 compatibility.
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-cov==6.2.1",
    "pytest-xdist>=3.6.0",
    "fastapi>=0.115.8,<1.0.0",
    "starlette>=1.3.1,<2.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "packaging>=25.0",
    "ruff==0.12.9",
    "mypy==1.17.1",
    "types-pillow==10.2.0.20240822",
    "types-aiofiles==24.1.0.20250809",
    "types-pyyaml==6.0.12.20250809",
    "reportlab>=4.2.0",
    "greenlet>=3.0.0",  # Required by .coveragerc concurrency=greenlet
]
telemetry = [
    # OpenTelemetry core
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    # Floor lifted for CVE-2026-33186 in grpcio, a transitive dependency of
    # opentelemetry-exporter-otlp-proto-grpc.
    "grpcio>=1.80.0,<2.0.0",
    # Exporters
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",  # For Tempo
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",  # For Langfuse
    # Auto-instrumentation
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-instrumentation-requests>=0.41b0",
    "opentelemetry-instrumentation-botocore>=0.41b0",
    "opentelemetry-instrumentation-logging>=0.41b0",
]
langfuse = [
    # Optional: Langfuse native SDK for rich LLM observability
    "langfuse>=2.0.0",
]
# langchain-aws and nvidia-nat are excluded from core deps because they
# require boto3>=1.42.42, which conflicts with aioboto3's boto3<1.40.62
# (used by material-agent-service for S3 sessions). Install when needed:
#   uv pip install -e ".[aws]"
#   uv pip install "nvidia-nat[langchain]>=1.5.0,<2.0.0" --extra-index-url https://pypi.nvidia.com
aws = [
    "langchain-aws>=1.4.0,<2.0.0",
    "boto3>=1.42.42,<2.0.0",
]
usd = [
    "usd-exchange>=2.3,<3",
]
ovrtx = ["ovrtx==0.3.0.312915"]
warp = [
    "warp-lang>=1.11.0",
    "newton>=1.2.0,<2.0",
]
all = [
    "world-understanding[dev]",
    "world-understanding[aws]",
    # [nat] excluded: nvidia-nat's aioboto3 requires boto3<1.40.62 which
    # conflicts with [aws]'s boto3>=1.42.42.
    "world-understanding[usd]",
    "world-understanding[telemetry]",
    "world-understanding[warp]",
]

[project.scripts]
wu = "world_understanding.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["world_understanding"]
ignore-vcs = true

[tool.hatch.build.targets.wheel.force-include]
"world_understanding/functions/graphics/pylock.ovrtx-runtime.toml" = "world_understanding/functions/graphics/pylock.ovrtx-runtime.toml"

[build-system]
requires = ["hatchling<1.27.0", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.uv-dynamic-versioning]
enable = true
vcs = "git"
pattern = "default-unprefixed"
fallback-version = "0.5.0"
from-file = { source = "VERSION.md" }

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv]
# Keep release-candidate public notice generation deterministic until the
# checked-in THIRD_PARTY_NOTICE.md is intentionally regenerated. Exact pins lock
# known notice-only resolver choices; floor constraints only cap security
# scanner findings where multiple newer transitive versions remain acceptable.
constraint-dependencies = [
    "anthropic==0.104.1",
    # Floors lifted for source-scan findings in transitive dependencies:
    # aiohttp request/body/cookie handling advisories and cryptography wheels
    # bundling vulnerable OpenSSL.
    "aiohttp>=3.14.1",
    "cryptography>=48.0.1",
    "idna==3.16",
    "langchain-anthropic==1.4.6",
    "langchain-google-genai==4.2.3",
    # langchain-core 1.4.9 requires langchain-protocol>=0.0.17. Keep the
    # notice-only resolver deterministic at the reviewed compatible release.
    "langchain-protocol==0.0.18",
    "langsmith==0.8.18",
    # The public notice generator resolves from project metadata instead of
    # uv.lock. Pin the reviewed PDFium wheel so notice regeneration cannot
    # drift independently of the checked-in lock and notice.
    "pypdfium2==5.12.0",
    # Keep exact pin for deterministic third-party notice generation while
    # staying above GHSA-82w8-qh3p-5jfq and GHSA-jp82-jpqv-5vv3.
    "starlette==1.3.1",
]

[[tool.uv.index]]
name = "nvidia-pypi"
url = "https://pypi.nvidia.com"

[tool.uv.sources]
nvidia-nat = { index = "nvidia-pypi" }
ovrtx = { index = "nvidia-pypi" }

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [
    "*.spec",
    "apps/texture_gen_step1x_service/internal/texture_editing_runtime",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "UP042", # Class inherits from both str and enum.Enum (StrEnum requires Python 3.11+)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "apps/material_agent/tests",
    "apps/material_agent_service/tests",
    "apps/validation_agent/tests",
    "apps/physics_agent/tests",
    "apps/physics_agent_service/tests",
    "apps/texture_agent/tests",
    "apps/texture_gen_step1x_service/tests",
    "apps/texture_agent_service/tests",
    "apps/ovrtx_rendering_api/tests",
    "agentic/packages/content_agent_workflows/tests",
    "agentic/packages/content_workflow_cli/tests",
    "agentic/packages/content_workbench/tests/unit",
]
pythonpath = [
    "apps/material_agent/tests",
    "apps/texture_agent/tests",
    "apps/ovrtx_rendering_api",
    "agentic/packages/content_workflow_cli",
    "agentic/packages/content_workbench",
    "agentic/packages/content_agent_workflows",
    "agentic/packages/content_workbench_agent_client",
    "apps/material_agent",
    "apps/validation_agent",
    "apps/physics_agent",
    "apps/texture_agent",
]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    # Ignore SWIG-related deprecation warnings from faiss-cpu
    "ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning",
    "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]
markers = [
    "live_inference: runs live provider inference (requires API keys and opt-in)",
]
addopts = "-ra --showlocals --color yes --cov-report term --cov-report html --cov-report xml --cov=./ --import-mode=importlib"

[tool.coverage.run]
source = ["world_understanding"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[project.entry-points.'nat.components']
world_understanding_nat_cv = "world_understanding.adapters.nat.register_cv"
world_understanding_nat_nlp = "world_understanding.adapters.nat.register_nlp"
world_understanding_nat_knowledge = "world_understanding.adapters.nat.register_knowledge"
world_understanding_nat_graphics = "world_understanding.adapters.nat.register_graphics"
