name: Anchore unpinned tool
on: push
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Bootstrap pinned Anchore tools
        timeout-minutes: 15
        run: bash ci/github/bootstrap-anchore-tools.sh
      - name: Scan dependencies
        timeout-minutes: 10
        uses: anchore/scan-action@pinned
        with:
          path: .
